[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bharrisana-parallexpert_jd248"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别预训练并行策略专家·查询改写的语义漂移上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bharrisana" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bharrisana.github.io"
Repository = "https://github.com/bharrisana/parallexpert_jd248"
Issues = "https://github.com/bharrisana/parallexpert_jd248/issues"

[project.scripts]
parallexpert_jd248 = "parallexpert_jd248:main"

[tool.setuptools]
py-modules = ["parallexpert_jd248"]
